<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thought Circle Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script></head>
<body><header><h1>Thought Circle Admin</h1><p><a href="index.html">मुख्य पृष्ठमा फर्कनुहोस्</a></p></header><main><p id="status">Admin प्यानल लोड हुँदैछ...</p><section id="login"><h2>लगइन</h2><label>Email <input id="email" type="email"></label><label>Password <input id="password" type="password"></label><button id="loginBtn">Login</button></section><section id="editor" hidden><h2>नयाँ लेख थप्नुहोस्</h2><label>शीर्षक <input id="title"></label><label>Slug (English, spaces बिना) <input id="slug"></label><label>Category <select id="category"><option value="national-news">राष्ट्रिय समाचार</option><option value="international-news">अन्तर्राष्ट्रिय समाचार</option><option value="literature">साहित्य</option><option value="opinion">विचार</option></select></label><label>छोटो विवरण <textarea id="excerpt"></textarea></label><label>लेख <textarea id="content" rows="10"></textarea></label><label>Cover image URL (वैकल्पिक) <input id="image"></label><label>लेखक <input id="author" value="Thought Circle"></label><label>भाषा <select id="language"><option value="ne">नेपाली</option><option value="en">English</option><option value="both">दुवै</option></select></label><label><input id="published" type="checkbox" checked> प्रकाशित गर्ने</label><button id="saveBtn">लेख सुरक्षित गर्नुहोस्</button><button id="logoutBtn">Logout</button><h2>लेखहरूको सूची</h2><div id="adminPosts"></div></section></main></body></html>
